# CR-0036: environment for generate_lidar_structure.py / build_lidar_sources.py
#   conda env create -f envs/lidar.yml && conda activate lidar
name: lidar
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pdal>=2.6,<3
  - python-pdal>=3.4
  - gdal>=3.8
  - numpy>=1.26,<2.2
  - scipy>=1.11
  - pyproj>=3.6
  - rasterio>=1.3.10
  - shapely>=2.0
  - pandas>=2.0
  - requests
